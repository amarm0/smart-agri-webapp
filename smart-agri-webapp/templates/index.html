<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Classification — Smart Agriculture AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌍 Land Type Classification from Satellite Imagery</h1>
      <p class="subtitle">Upload a satellite image (EuroSAT-style) and the model will tell you its detailed class and booklet category</p>
    </header>

    {% if model_error %}
    <div class="alert alert-error">
      ⚠️ {{ model_error }}
    </div>
    {% endif %}

    <div class="card">
      <form id="upload-form">
        <label for="file-input" class="dropzone" id="dropzone">
          <input type="file" id="file-input" name="image" accept="image/*" hidden>
          <div id="drop-text">
            <span class="icon">📤</span>
            <p>Drag an image here, or click to choose one</p>
            <p class="hint">PNG / JPG — works best with satellite-style imagery (EuroSAT)</p>
          </div>
          <img id="preview" alt="preview" hidden>
        </label>
        <button type="submit" id="classify-btn" {{ 'disabled' if model_error else '' }}>Classify image</button>
      </form>

      <div id="result" class="result" hidden></div>
      <div id="loading" class="loading" hidden>⏳ Analyzing...</div>
      <div id="error-box" class="alert alert-error" hidden></div>
    </div>

    <footer>
      Runs fully locally — no image is ever uploaded to any cloud service.
    </footer>
  </div>

<script>
const fileInput = document.getElementById('file-input');
const dropzone = document.getElementById('dropzone');
const preview = document.getElementById('preview');
const dropText = document.getElementById('drop-text');
const form = document.getElementById('upload-form');
const resultBox = document.getElementById('result');
const loadingBox = document.getElementById('loading');
const errorBox = document.getElementById('error-box');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  preview.src = URL.createObjectURL(file);
  preview.hidden = false;
  dropText.hidden = true;
  resultBox.hidden = true;
  errorBox.hidden = true;
});

['dragover', 'dragleave', 'drop'].forEach(evt => {
  dropzone.addEventListener(evt, e => e.preventDefault());
});
dropzone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) {
    fileInput.files = e.dataTransfer.files;
    fileInput.dispatchEvent(new Event('change'));
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = fileInput.files[0];
  if (!file) { return; }

  resultBox.hidden = true;
  errorBox.hidden = true;
  loadingBox.hidden = false;

  const formData = new FormData();
  formData.append('image', file);

  try {
    const res = await fetch('/predict', { method: 'POST', body: formData });
    const data = await res.json();
    loadingBox.hidden = true;

    if (!data.ok) {
      errorBox.textContent = data.error;
      errorBox.hidden = false;
      return;
    }

    const [best, ...rest] = data.top;
    resultBox.innerHTML = `
      <div class="best-result">
        <div class="badge">${best.booklet_en}</div>
        <p class="class-line">Detailed class: <strong>${best.class_en}</strong></p>
        <p class="conf-line">Confidence: <strong>${(best.prob * 100).toFixed(1)}%</strong></p>
      </div>
      <details class="runner-up">
        <summary>Other possibilities</summary>
        <ul>
          ${rest.map(r => `<li>${r.class_en} — ${(r.prob * 100).toFixed(1)}% → ${r.booklet_en}</li>`).join('')}
        </ul>
      </details>
    `;
    resultBox.hidden = false;
  } catch (err) {
    loadingBox.hidden = true;
    errorBox.textContent = 'An error occurred while contacting the local server.';
    errorBox.hidden = false;
  }
});
</script>
</body>
</html>
